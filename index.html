<!DOCTYPE html>

  <title>pH Scale</title>
  <link rel="stylesheet"href="style.css">
</head>
<body>

  <header>
    <h1>pH Scale</h1>
  </header>

    <!--Basic (blue) section -->
    <ul class="basic">
      <li>14.0 VERY ALKALINE</li>
      <li>13.0</li>

    <!-- Acidic (pink) section -->
    <ul class=".acidic">
      <li>6.0</li>

</html>
